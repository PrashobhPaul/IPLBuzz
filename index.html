<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IPLBuzz · IPL 2026</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#070d1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IPLBuzz">
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=DM+Sans:wght@400;500&family=Barlow+Condensed:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#070d1a;--s1:rgba(12,21,42,.86);--s2:rgba(21,34,64,.9);--bd:#243350;--bd2:#37527f;--gold:#f5b301;--amber:#f2872a;--maroon:#12325f;--silver:#cdd6e6;--red:#e0473a;--green:#3fb96e;--txt:#e9eefb;--dim:#7e8aa6;--dim2:#aab6d0}
/* Global stadium backdrop — one fixed layer, identical on every device */
body{background:var(--bg);color:var(--txt);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;z-index:-1;
  background:linear-gradient(180deg,rgba(6,11,24,.84) 0%,rgba(6,11,24,.9) 55%,rgba(6,11,24,.95) 100%),
             url('bg.jpg') center top/cover no-repeat;
  background-attachment:scroll}
nav{display:flex;align-items:center;height:54px;padding:0 16px;background:rgba(8,14,28,.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:100;gap:2px}
.brand{display:flex;align-items:center;gap:8px;font-family:'Teko',sans-serif;font-size:24px;font-weight:700;color:var(--txt);cursor:pointer;margin-right:12px;letter-spacing:-.5px;flex-shrink:0}
.brand-logo{height:34px;width:34px;object-fit:contain;border-radius:6px;filter:drop-shadow(0 0 6px rgba(240,165,0,.25))}
.brand b{color:var(--gold)}
@media (max-width:560px){.brand span{display:none}.brand-logo{height:30px;width:30px}}
.nav-btns{display:flex;gap:2px;flex-shrink:0}
nav button{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim2);background:none;border:none;cursor:pointer;padding:5px 10px;border-radius:4px;transition:.15s;white-space:nowrap}
nav button:hover{color:var(--txt);background:var(--s2)}
nav button.on{color:var(--gold);background:rgba(240,165,0,.1)}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:6px;flex-shrink:0}

.api-input:focus{border-color:var(--gold)}
.api-input::placeholder{color:var(--dim)}
.api-save{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:5px 10px;border-radius:4px;border:1px solid var(--bd2);background:var(--s2);color:var(--dim2);cursor:pointer}
.api-save:hover{color:var(--txt);border-color:var(--gold)}
.sh{margin-bottom:18px}
.sh h2{font-family:'Teko',sans-serif;font-size:28px;font-weight:700;letter-spacing:-.3px;line-height:1}
.sh p{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--dim);margin-top:3px}
/* ── LIVE TILE ── */
.live-tile{background:var(--s1);border:1px solid var(--bd);border-radius:10px;margin-bottom:22px;position:relative;overflow:hidden;transition:border-color .2s}
.live-tile::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--green)}
.live-tile:hover{border-color:var(--bd2)}
.live-tile-header{padding:14px 18px 12px;cursor:pointer;user-select:none}
.live-tag{display:flex;align-items:center;gap:6px;font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--green);margin-bottom:10px}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
.live-scores-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.live-team-score{flex:1;min-width:120px}
.live-tname{font-family:'Teko',sans-serif;font-size:22px;font-weight:700;line-height:1;display:flex;align-items:center;gap:7px}
.tdot{width:9px;height:9px;border-radius:50%;flex-shrink:0;display:inline-block}
.tlogo{object-fit:contain;vertical-align:middle;flex-shrink:0}
.live-sc{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;color:var(--gold);margin-top:2px}
.live-sc small{font-size:12px;color:var(--dim2);font-weight:400;margin-left:2px}
.live-vs{font-family:'Teko',sans-serif;font-size:15px;color:var(--dim);flex-shrink:0}
.live-status-txt{font-family:'Barlow Condensed',sans-serif;font-size:12px;color:var(--dim2);margin-top:8px;line-height:1.4}
.live-expand-row{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.expand-hint{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:5px}
.expand-arrow{display:inline-block;transition:transform .25s;font-size:10px;color:var(--dim)}
.expand-arrow.open{transform:rotate(180deg)}
.live-footer{display:flex;align-items:center;gap:10px}
.btn-refresh{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);background:rgba(240,165,0,.08);border:1px solid rgba(240,165,0,.2);padding:4px 12px;border-radius:4px;cursor:pointer;transition:.15s}
.btn-refresh:hover{background:rgba(240,165,0,.16)}
.btn-refresh:disabled{opacity:.5;cursor:not-allowed}
.last-upd{font-family:'Barlow Condensed',sans-serif;font-size:10px;color:var(--dim)}

/* ── EXPANDED SCORECARD ── */
.live-detail{display:none;border-top:1px solid var(--bd);padding:0 18px 16px}
.live-detail.open{display:block}
.sc-section{margin-top:14px}
.sc-section-title{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--dim);margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid var(--bd)}
.sc-table{width:100%;border-collapse:collapse}
.sc-table th{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);padding:4px 6px;text-align:right}
.sc-table th:first-child{text-align:left}
.sc-table td{font-family:'Barlow Condensed',sans-serif;font-size:13px;padding:5px 6px;text-align:right;border-bottom:1px solid rgba(34,40,64,.6)}
.sc-table td:first-child{text-align:left;color:var(--txt)}
.sc-table tr:last-child td{border-bottom:none}
.sc-name{font-weight:700}
.sc-note{font-size:10px;color:var(--dim);font-weight:400;display:block;margin-top:1px}
.sc-batting{color:var(--gold);font-weight:700}
.sc-balls{color:var(--dim2)}
.sc-highlight{color:var(--green)}
.sc-bowler-w{color:var(--red);font-weight:700}
.balls-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.ball{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Teko',sans-serif;font-size:13px;font-weight:700;flex-shrink:0}
.ball-dot{background:var(--s2);border:1px solid var(--bd);color:var(--dim)}
.ball-run{background:var(--s2);border:1px solid var(--bd2);color:var(--txt)}
.ball-four{background:rgba(207,210,218,.14);border:1px solid rgba(207,210,218,.4);color:var(--silver)}
.ball-six{background:rgba(240,165,0,.15);border:1px solid rgba(240,165,0,.4);color:var(--gold)}
.ball-wicket{background:rgba(224,52,26,.15);border:1px solid rgba(224,52,26,.4);color:var(--red)}
.ball-wide{background:var(--s2);border:1px solid var(--bd);color:var(--dim);font-size:9px}
.ball-over-sep{width:1px;background:var(--bd);margin:0 2px;height:26px;flex-shrink:0}
.crr-row{display:flex;gap:16px;margin-top:10px;flex-wrap:wrap}
.crr-item{font-family:'Barlow Condensed',sans-serif;font-size:12px;color:var(--dim2)}
.crr-item b{color:var(--txt);font-weight:700}

/* ── API NOTICE ── */
.api-notice-tile{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:14px 18px;margin-bottom:22px}
.api-notice{font-family:'Barlow Condensed',sans-serif;font-size:12px;color:var(--dim);line-height:1.7}
.api-notice a{color:var(--gold);text-decoration:none}
.api-notice a:hover{text-decoration:underline}
.live-msg{font-family:'Barlow Condensed',sans-serif;font-size:13px;color:var(--dim2);line-height:1.6}


/* ── MATCH CENTRE ── */
.mc-card{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:18px 20px;margin-bottom:10px;cursor:pointer;transition:.14s;position:relative;overflow:hidden}
.mc-card:hover{background:var(--s2);border-color:var(--bd2)}
.mc-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px}
.mc-card.completed::before{background:var(--green)}
.mc-card.live::before{background:var(--gold)}
.mc-card.upcoming::before{background:var(--bd2)}
.mc-match-no{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--dim);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.mc-status-badge{padding:2px 8px;border-radius:3px;font-size:9px;font-weight:700;letter-spacing:2px}
.mc-status-badge.completed{background:rgba(29,185,84,.12);color:var(--green);border:1px solid rgba(29,185,84,.25)}
.mc-status-badge.live{background:rgba(240,165,0,.12);color:var(--gold);border:1px solid rgba(240,165,0,.3)}
.mc-status-badge.upcoming{background:var(--s2);color:var(--dim);border:1px solid var(--bd)}
.mc-teams-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.mc-team{flex:1;min-width:120px}
.mc-team-name{font-family:'Teko',sans-serif;font-size:22px;font-weight:700;line-height:1;display:flex;align-items:center;gap:8px}
.mc-score{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;color:var(--gold);margin-top:3px}
.mc-score.batting{color:var(--txt)}
.mc-vs{font-family:'Teko',sans-serif;font-size:16px;color:var(--dim);flex-shrink:0}
.mc-result{font-family:'Barlow Condensed',sans-serif;font-size:12px;color:var(--dim2);margin-top:10px;line-height:1.4}
.mc-result b{color:var(--gold)}
.mc-venue{font-family:'Barlow Condensed',sans-serif;font-size:11px;color:var(--dim);margin-top:4px}

/* Match Detail */
.md-hero{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:20px 22px;margin-bottom:20px;position:relative;overflow:hidden}
.md-hero-title{font-family:'Teko',sans-serif;font-size:14px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin-bottom:14px}
.md-scores{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.md-team{flex:1;min-width:130px}
.md-tname{font-family:'Teko',sans-serif;font-size:26px;font-weight:700;line-height:1;display:flex;align-items:center;gap:8px}
.md-score{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:700;color:var(--gold);margin-top:4px;letter-spacing:.5px}
.md-score small{font-size:13px;color:var(--dim2);font-weight:400}
.md-vs{font-family:'Teko',sans-serif;font-size:18px;color:var(--dim);flex-shrink:0}
.md-result-bar{background:rgba(29,185,84,.08);border:1px solid rgba(29,185,84,.2);border-radius:6px;padding:10px 14px;margin-top:10px}
.md-result-txt{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:var(--green);letter-spacing:.5px}
.md-meta-row{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px}
.md-meta-item{font-family:'Barlow Condensed',sans-serif;font-size:11px;color:var(--dim2);letter-spacing:.5px}
.md-meta-item b{color:var(--txt)}

/* Player of Match section */
.pom-section{background:linear-gradient(135deg,rgba(240,165,0,.1),rgba(240,165,0,.05));border:1px solid rgba(240,165,0,.2);border-radius:8px;padding:14px 16px;margin-top:12px}
.pom-title{font-family:'Barlow Condensed',sans-serif;font-size:9px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.pom-content{display:flex;align-items:center;gap:12px}
.pom-name{font-family:'Teko',sans-serif;font-size:20px;font-weight:700;color:var(--txt);line-height:1}
.pom-stats{font-family:'Barlow Condensed',sans-serif;font-size:12px;color:var(--dim2);margin-top:2px}

/* Analytics tabs */
.atabs{display:flex;gap:0;border-bottom:1px solid var(--bd);margin-bottom:20px;overflow-x:auto}
.atab{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--dim);background:none;border:none;cursor:pointer;padding:10px 14px;border-bottom:2px solid transparent;transition:.14s;white-space:nowrap;flex-shrink:0}
.atab:hover{color:var(--txt)}
.atab.on{color:var(--gold);border-bottom-color:var(--gold)}
.ana-content{display:none}
.ana-content.on{display:block}

/* ── STATS ── */
.stat-section-title{font-family:'Teko',sans-serif;font-size:26px;font-weight:700;color:var(--txt);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.stats-note{font-family:'Barlow Condensed',sans-serif;font-size:12px;color:var(--dim);background:var(--s2);padding:10px 14px;border-radius:6px;border-left:3px solid var(--bd2)}
.stat-row{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--s1);border-bottom:1px solid var(--bd)}
.stat-row:first-child{border-radius:8px 8px 0 0}
.stat-row:last-child{border-bottom:none;border-radius:0 0 8px 8px}
.stat-row:hover{background:var(--s2)}
.stat-rank{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:var(--dim2);width:24px;text-align:center;flex-shrink:0}
.stat-rank.gold{color:var(--gold);background:rgba(240,165,0,.1);border-radius:50%;padding:2px}
.stat-rank.silver{color:#c0c0c0;background:rgba(192,192,192,.1);border-radius:50%;padding:2px}
.stat-rank.bronze{color:#cd7f32;background:rgba(205,127,50,.1);border-radius:50%;padding:2px}
.stat-info{flex:1;min-width:0}
.stat-name{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;color:var(--txt)}
.stat-team{font-family:'Barlow Condensed',sans-serif;font-size:11px;color:var(--dim);letter-spacing:.5px}
.stat-bar-bg{height:4px;background:var(--bd);border-radius:2px;overflow:hidden;margin-top:4px}
.stat-bar-fill{height:100%;border-radius:2px;transition:.3s}
.stat-val{font-family:'Teko',sans-serif;font-size:20px;font-weight:700;line-height:1;text-align:right}
.stat-sub{font-family:'Barlow Condensed',sans-serif;font-size:11px;color:var(--dim2);text-align:right;margin-top:1px}
.stat-logo{width:32px;height:32px;border-radius:50%;object-fit:contain;margin-right:6px}
.stat-logo-fb{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;color:#fff;margin-right:6px}

/* ── WORM CHART ── */
.worm-chart-wrap{position:relative;background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:18px;margin-bottom:20px}
.worm-chart-title{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin-bottom:14px}
.worm-svg{width:100%;height:300px}
.worm-legend{display:flex;gap:16px;margin-top:10px}
.worm-legend-item{display:flex;align-items:center;gap:6px;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700}
.worm-legend-dot{width:8px;height:8px;border-radius:50%}

/* ── OVER ANALYSIS ── */
.ov-chart-wrap{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:18px;margin-bottom:20px}
.ov-bars{display:flex;align-items:end;gap:2px;height:200px;margin-bottom:14px}
.ov-bar{background:rgba(240,165,0,.3);border-radius:2px 2px 0 0;min-width:12px;position:relative;cursor:pointer;transition:.15s;display:flex;align-items:end;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;color:var(--txt)}
.ov-bar:hover{background:rgba(240,165,0,.5)}
.ov-bar.has-wicket{background:rgba(224,52,26,.4)}
.ov-bar.has-wicket:hover{background:rgba(224,52,26,.6)}
.ov-bar-label{position:absolute;bottom:-20px;font-size:9px;color:var(--dim)}
.ov-controls{display:flex;gap:8px;margin-bottom:14px}
.ov-btn{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--dim);background:var(--s2);border:1px solid var(--bd);padding:6px 12px;border-radius:4px;cursor:pointer;transition:.14s}
.ov-btn:hover,.ov-btn.on{background:var(--gold);color:#000;border-color:var(--gold)}

/* ── PARTNERSHIPS ── */
.part-list{display:flex;flex-direction:column;gap:8px}
.part-item{background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:14px 16px;cursor:pointer;transition:.14s}
.part-item:hover{background:var(--s2);border-color:var(--bd2)}
.part-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.part-wkt{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--dim)}
.part-runs{font-family:'Teko',sans-serif;font-size:20px;font-weight:700;color:var(--gold)}
.part-players{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;color:var(--txt)}
.part-details{font-family:'Barlow Condensed',sans-serif;font-size:12px;color:var(--dim2);margin-top:4px}

/* ── PLAYER ANALYSIS ── */
.player-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.player-card{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:16px;transition:.14s}
.player-card:hover{background:var(--s2);border-color:var(--bd2)}
.player-header{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.player-name{font-family:'Barlow Condensed',sans-serif;font-size:16px;font-weight:700;color:var(--txt)}
.player-role{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin-top:2px}
.player-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.player-stat{text-align:center}
.player-stat-val{font-family:'Teko',sans-serif;font-size:18px;font-weight:700;color:var(--gold);line-height:1}
.player-stat-label{font-family:'Barlow Condensed',sans-serif;font-size:10px;color:var(--dim);letter-spacing:1px;text-transform:uppercase;margin-top:2px}

/* ── KEY MOMENTS ── */
.km-list{display:flex;flex-direction:column;gap:10px}
.km-item{background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:14px 16px;border-left:4px solid var(--gold)}
.km-header{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.km-over{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold);background:rgba(240,165,0,.1);padding:2px 8px;border-radius:3px}
.km-icon{font-size:16px}
.km-title{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:var(--txt);flex:1}
.km-text{font-family:'Barlow Condensed',sans-serif;font-size:14px;color:var(--txt);line-height:1.4}
.km-text small{color:var(--dim2);font-size:11px;display:block;margin-top:2px}

/* Player ratings */
.rating-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.rating-card{background:var(--s1);border:1px solid var(--bd);border-radius:8px;padding:14px}
.rating-name{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;color:var(--txt)}
.rating-role{font-family:'Barlow Condensed',sans-serif;font-size:10px;color:var(--dim);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px;margin-top:2px}
.rating-bar-wrap{height:6px;background:var(--bd);border-radius:3px;margin-top:6px;overflow:hidden}
.rating-bar{height:100%;border-radius:3px}

/* ═══════════════ PREMIUM ANIMATIONS ═══════════════ */
@keyframes viewIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes barX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes barY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes wormDraw{to{stroke-dashoffset:0}}
@keyframes sheen{0%{transform:translateX(-120%) rotate(8deg)}100%{transform:translateX(320%) rotate(8deg)}}
@keyframes fabPulse{0%,100%{box-shadow:0 6px 20px rgba(0,0,0,.4),0 0 0 0 rgba(240,165,0,.45)}50%{box-shadow:0 6px 20px rgba(0,0,0,.4),0 0 0 12px rgba(240,165,0,0)}}
@keyframes popIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}

/* view enters with a gentle fade-rise */
.view.on{animation:viewIn .42s cubic-bezier(.22,.61,.36,1)}

/* premium surface transitions + lift on hover */
.mc-card,.team-card,.tc-key,.stat-row,.part-item,.km-item,.player-card,.tc-player{transition:transform .18s cubic-bezier(.22,.61,.36,1),border-color .18s,background .18s,box-shadow .18s}
.mc-card:hover,.part-item:hover{transform:translateY(-3px);box-shadow:0 10px 26px -14px rgba(0,0,0,.7);border-color:var(--bd2)}
.tc-key:hover{transform:translateY(-2px);border-color:var(--bd2)}
.live-tile{transition:transform .2s,border-color .2s,box-shadow .2s}
.live-tile:hover{transform:translateY(-2px);box-shadow:0 14px 30px -18px rgba(0,0,0,.8)}

/* staggered reveal for lists (first ~14 items) */
#match-list .mc-card,.team-list .team-card,#home-content .mrow,.tc-key-grid .tc-key,#match-analytics .part-item,#match-analytics .km-item,.player-grid .player-card{animation:riseIn .5s both cubic-bezier(.22,.61,.36,1)}
#match-list .mc-card:nth-child(n+1),.team-list .team-card:nth-child(n+1){animation-delay:.02s}
.stagger>*{animation:riseIn .5s both cubic-bezier(.22,.61,.36,1)}
.stagger>*:nth-child(1){animation-delay:.03s}.stagger>*:nth-child(2){animation-delay:.06s}
.stagger>*:nth-child(3){animation-delay:.09s}.stagger>*:nth-child(4){animation-delay:.12s}
.stagger>*:nth-child(5){animation-delay:.15s}.stagger>*:nth-child(6){animation-delay:.18s}
.stagger>*:nth-child(7){animation-delay:.21s}.stagger>*:nth-child(8){animation-delay:.24s}
.stagger>*:nth-child(9){animation-delay:.27s}.stagger>*:nth-child(n+10){animation-delay:.3s}

/* animated stat & rating bars grow from the left */
.stat-bar-fill,.rating-bar{transform-origin:left;animation:barX .9s .15s both cubic-bezier(.22,.61,.36,1)}

/* worm chart draws itself */
.worm-svg polyline{stroke-dasharray:3000;stroke-dashoffset:3000;animation:wormDraw 1.5s .2s ease forwards;stroke-linecap:round;stroke-linejoin:round}

/* over-analysis bars grow up, lightly staggered */
.ov-bar{transform-origin:bottom;animation:barY .55s both cubic-bezier(.22,.61,.36,1)}
.ov-bar:hover{background:rgba(240,165,0,.55)}
.ov-bar.has-wicket{background:rgba(198,35,48,.5)}
.ov-bar.has-wicket:hover{background:rgba(198,35,48,.75)}

/* champions banner sheen */
.champ-banner{position:relative;overflow:hidden}
.champ-banner::after{content:'';position:absolute;top:-40%;left:0;width:40%;height:180%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.14),transparent);animation:sheen 4.5s ease-in-out infinite}

/* stat leaderboard rows pop in */
#stats-content .stat-row{animation:riseIn .45s both}
#stats-content .stat-row:nth-child(1){animation-delay:.02s}#stats-content .stat-row:nth-child(2){animation-delay:.05s}
#stats-content .stat-row:nth-child(3){animation-delay:.08s}#stats-content .stat-row:nth-child(4){animation-delay:.11s}
#stats-content .stat-row:nth-child(5){animation-delay:.14s}#stats-content .stat-row:nth-child(n+6){animation-delay:.17s}

/* fab pulse + press feedback */
#chat-fab{animation:fabPulse 3s ease-in-out infinite;transition:transform .15s}
#chat-fab:hover{transform:scale(1.08)}
#chat-fab:active{transform:scale(.94)}

:root{

html{scroll-behavior:smooth}

/* refined scrollbar */
*{scrollbar-width:thin;scrollbar-color:var(--bd2) transparent}

.mc-team-name .tlogo,.md-tname .tlogo,.live-tname .tlogo{padding:1px}
a:hover>.tlogo,.mc-card:hover .tlogo,.mrow:hover .tlogo{transform:scale(1.06);box-shadow:0 0 0 1.8px var(--gold),0 4px 12px -3px rgba(0,0,0,.7),0 0 14px rgba(245,179,1,.3)}

// ═══════════════════════════════════════════════════════════════════
// CONFIG — the single place to update for a new IPL season.
// Point DATA at new CSVs (or flip LIVE.enabled to read live scores from

// ═══════════════════════════════════════════════════════════════════
const CONFIG = {
  season: '2026',
  seasonLabel: 'IPL 2026',
  // Static datasets (relative paths). Swap these each season.

async function loadSeasonDataFromCSVs(){
  try{
    var D = CONFIG.data;
    var opt = function(url){ return fetch(url).then(r=>r.text()).catch(function(){ return ''; }); };
    var files = await Promise.all([
      fetch(D.schedule).then(r=>r.text()),
      fetch(D.points).then(r=>r.text()),
      fetch(D.batting).then(r=>r.text()),
      fetch(D.bowling).then(r=>r.text()),
      fetch(D.partnerships).then(r=>r.text()),
      fetch(D.fow).then(r=>r.text()),
      opt(D.overs), opt(D.squads), opt(D.teams)
    ]);
    var scheduleRows = parseCSV(files[0]), pointsRows = parseCSV(files[1]);
    var battingRows = parseCSV(files[2]), bowlingRows = parseCSV(files[3]);
    var partRows = parseCSV(files[4]), fowRows = parseCSV(files[5]);
    var oversRows = files[6] ? parseCSV(files[6]) : [];

    POINTS = pointsRows.map(function(r){
      return { team:r.team, p:+r.m||0, w:+r.w||0, l:+r.l||0, nr:+r.nr||0, pts:+r.pts||0, nrr:r.nrr||'0.00' };
    });

    var byMatchInningsBat = groupRows(battingRows, ['match_no','innings']);
    var byMatchInningsBowl = groupRows(bowlingRows, ['match_no','innings']);
    var byMatchInningsPart = groupRows(partRows, ['match_no','innings']);
    var byMatchInningsFow = groupRows(fowRows, ['match_no','innings']);
    var byMatchInningsOvers = groupRows(oversRows, ['match_no','innings']);

    MATCHES = scheduleRows.map(function(r){
      var no = +r.no;
      var id = 'm'+no;
      var completed = String(r.completed).toLowerCase()==='true';
      var inn1Team = r.inn1_team || r.t1;
      var inn2Team = r.inn2_team || r.t2;
      var inn1 = buildInnings(no, 1, inn1Team, r.t1score, byMatchInningsBat, byMatchInningsBowl, byMatchInningsFow, byMatchInningsPart);
      var inn2 = buildInnings(no, 2, inn2Team, r.t2score, byMatchInningsBat, byMatchInningsBowl, byMatchInningsFow, byMatchInningsPart);
      attachOvers(inn1, byMatchInningsOvers[no+'|1']);
      attachOvers(inn2, byMatchInningsOvers[no+'|2']);
      return {
        id:id, no:no, date:(r.date||'')+' 2026', time:r.time||'', venue:r.venue, t1:r.t1, t2:r.t2,
        status: completed ? 'completed' : 'upcoming',
        stage: r.stage||'', nr: String(r.nr).toLowerCase()==='true',
        toss:r.toss||'', result:r.result||'', playerOfMatch:(r.pom||'').split('·')[0].trim(),
        t1score:r.t1score||'', t1ov:r.t1ov||'', t2score:r.t2score||'', t2ov:r.t2ov||'',
        inn1: inn1, inn2: inn2
      };
    });

    // Real 2026 squads
    if(files[7]){
      var squadRows = parseCSV(files[7]);
      Object.keys(SQUADS).forEach(function(k){ delete SQUADS[k]; });
      squadRows.forEach(function(r){
        if(!r.team || !r.player) return;
        if(!SQUADS[r.team]) SQUADS[r.team] = {};
        SQUADS[r.team][r.player] = { role: r.role || '' };
      });
    }
    // Captain / coach / titles from Teams.csv
    if(files[8]){
      parseCSV(files[8]).forEach(function(r){
        var ab = r.abbr; if(!ab || !TEAMS[ab]) return;
        TEAMS[ab].captain = r.captain || '';
        TEAMS[ab].coach = r.coach || '';
        TEAMS[ab].city = r.city || '';
        TEAMS[ab].titles = r.titles || '0';
        TEAMS[ab].titleYears = r.titleYears || '';
      });
    }
  }catch(e){
    console.warn('CSV load failed, using embedded fallback data.', e);
  }
}

// Where a team finished in the tournament
function teamFinish(teamCode){
  var ord = function(n){ return n+(['th','st','nd','rd'][(n%100>>3^1&&n%10)]||'th'); };
  var pos = POINTS.findIndex(function(p){ return p.team === teamCode; }) + 1;
  var finalM = MATCHES.find(function(m){ return m.stage==='Final'; });
  var q2 = MATCHES.find(function(m){ return m.stage==='Qualifier 2'; });
  var elim = MATCHES.find(function(m){ return m.stage==='Eliminator'; });
  var winnerOf = function(m){ return m ? m.result.split(' ')[0] : ''; };
  var loserOf = function(m){ if(!m) return ''; var w=winnerOf(m); return m.t1===w?m.t2:m.t1; };
  if(finalM && winnerOf(finalM)===teamCode) return {label:'CHAMPIONS', tone:'champ', pos:1};
  if(finalM && loserOf(finalM)===teamCode) return {label:'Runners-up', tone:'runner', pos:2};
  if(q2 && loserOf(q2)===teamCode) return {label:'Lost Qualifier 2 · 3rd', tone:'playoff', pos:3};
  if(elim && loserOf(elim)===teamCode) return {label:'Lost Eliminator · 4th', tone:'playoff', pos:4};
  return {label:ord(pos)+' · Missed playoffs', tone:'league', pos:pos};
}

// Top 3 performers of a team's season
function teamKeyPlayers(teamCode, bat, bowl){
  var out = [];
  var teamBat = bat.filter(function(p){ return p.team===teamCode; }).sort(function(a,b){ return b.runs-a.runs; });
  var teamBowl = bowl.filter(function(p){ return p.team===teamCode; }).sort(function(a,b){ return b.wkts-a.wkts || a.runs-b.runs; });
  var used = {};
  if(teamBat[0] && teamBat[0].runs>0){ var b=teamBat[0]; used[b.name]=1; out.push({n:b.name, tag:'Top Scorer', stat:b.runs+' runs · SR '+b.sr, sub:b.fifties+'x50 '+b.hundreds+'x100'}); }
  if(teamBowl[0] && teamBowl[0].wkts>0){ var w=teamBowl[0]; used[w.name]=1; out.push({n:w.name, tag:'Top Wicket-taker', stat:w.wkts+' wkts · Econ '+w.econ, sub:'Best '+w.best}); }
  // third: best remaining impact (next batter, else next bowler)
  var third = teamBat.find(function(p){ return !used[p.name] && p.runs>0; });
  var thirdW = teamBowl.find(function(p){ return !used[p.name] && p.wkts>0; });
  if(third && (!thirdW || third.runs*1.0 >= thirdW.wkts*22)){ out.push({n:third.name, tag:'Impact', stat:third.runs+' runs · SR '+third.sr, sub:third.sixes+' sixes'}); }
  else if(thirdW){ out.push({n:thirdW.name, tag:'Impact', stat:thirdW.wkts+' wkts · Econ '+thirdW.econ, sub:'Best '+thirdW.best}); }
  return out;
}

function parseCSV(text){
  var lines = text.trim().split(/\r?\n/);
  if(!lines.length) return [];
  var headers = splitCSVLine(lines[0]);
  return lines.slice(1).filter(Boolean).map(function(line){
    var cols = splitCSVLine(line), obj = {};
    headers.forEach(function(h,i){ obj[h] = (cols[i]||'').trim(); });
    return obj;
  });
}
function splitCSVLine(line){
  var out=[], cur='', q=false;
  for(var i=0;i<line.length;i++){
    var ch=line[i];
    if(ch === '"'){ q = !q; continue; }
    if(ch===',' && !q){ out.push(cur); cur=''; continue; }
    cur += ch;
  }
  out.push(cur);
  return out;
}
function groupRows(rows, keys){
  var map={};
  rows.forEach(function(r){
    var k = keys.map(function(x){ return r[x]; }).join('|');
    if(!map[k]) map[k]=[];
    map[k].push(r);
  });
  return map;
}
function buildInnings(matchNo, inningsNo, team, total, batMap, bowlMap, fowMap, partMap){
  var key = matchNo+'|'+inningsNo;
  return {
    team: team,
    total: total || '',
    batting: (batMap[key]||[]).map(function(r){ return { n:r.player, r:+r.runs||0, b:+r.balls||0, f:+r.fours||0, s:+r.sixes||0, d:r.dismissal||'' }; }),
    bowling: (bowlMap[key]||[]).map(function(r){ return { n:r.player, o:r.overs, r:+r.runs||0, w:+r.wickets||0 }; }),
    fow: (fowMap[key]||[]).map(function(r){ return { wkt:+r.wkt||0, r:+r.runs||0, ov:r.over, bat:r.batsman }; }),
    pships: (partMap[key]||[]).map(function(r){ return { wkt:+r.wkt||0, p1:r.p1, p2:r.p2, r:+r.runs||0, b:+r.balls||0 }; })
  };
}
function attachOvers(inn, rows){
  if(!inn || !rows || !rows.length) return;
  var maxOver = 0;
  rows.forEach(function(r){ if((+r.over) > maxOver) maxOver = +r.over; });
  var overR = new Array(maxOver+1).fill(0);
  var overW = new Array(maxOver+1).fill(0);
  rows.forEach(function(r){ overR[+r.over] = +r.runs||0; overW[+r.over] = +r.wickets||0; });
  inn.overR = overR;
  inn.overW = overW;
}

// ═══════════════ PREMIUM INTERACTIONS ═══════════════
var Premium = (function(){
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  // Count-up for plain-number elements
  function countUp(el){
    var raw = (el.textContent||'').trim();
    if(!/^\d+(\.\d+)?\*?$/.test(raw)) return;
    var star = raw.endsWith('*') ? '*' : '';
    var target = parseFloat(raw), dec = (raw.split('.')[1]||'').replace('*','').length;
    if(reduce || target===0){ return; }
    var dur = 900, t0 = null;
    el.style.willChange='contents';
    function step(ts){
      if(!t0) t0=ts; var p = Math.min(1,(ts-t0)/dur);
      var e = 1-Math.pow(1-p,3);
      el.textContent = (target*e).toFixed(dec) + (p>=1?star:'');
      if(p<1) requestAnimationFrame(step); else { el.textContent = target.toFixed(dec)+star; el.style.willChange=''; }
    }
    requestAnimationFrame(step);
  }
  // Scroll reveal
  var io = ('IntersectionObserver' in window) ? new IntersectionObserver(function(entries){
    entries.forEach(function(en){ if(en.isIntersecting){ en.target.classList.add('in');
      if(en.target._counts){ en.target._counts.forEach(countUp); en.target._counts=null; }
      io.unobserve(en.target); } });
  },{rootMargin:'0px 0px -8% 0px',threshold:.08}) : null;

  function enhance(root){
    if(!root) return;
    // count-up: attach numbers to the nearest reveal card so they fire in-view
    var nums = root.querySelectorAll('.stat-val,.tc-record-val,.rating-val,.part-runs');
    if(!io || reduce){ nums.forEach(countUp); }
    // reveal: tag major cards/sections in this view
    var cards = root.querySelectorAll('.mc-card,.team-card,.part-item,.km-item,.player-card,.rating-card,.stat-row,.tc-section,.champ-banner,.live-tile,.md-hero,.worm-chart-wrap,.ov-chart-wrap,.pom-section');
    cards.forEach(function(c){
      c.classList.add('reveal');
      c._counts = Array.prototype.filter.call(c.querySelectorAll('.stat-val,.tc-record-val,.rating-val,.part-runs'), function(){return true;});
      if(io && !reduce) io.observe(c); else c.classList.add('in');
    });
    // any numbers not inside a reveal card → count immediately when io present
    if(io && !reduce){
      nums.forEach(function(n){ if(!n.closest('.reveal')) countUp(n); });
    }
    // safety net: never leave on-screen content hidden if the observer misfires
    setTimeout(function(){
      root.querySelectorAll('.reveal:not(.in)').forEach(function(el){
        var r = el.getBoundingClientRect();
        if(r.top < (window.innerHeight||800) && r.bottom > 0){ el.classList.add('in'); if(el._counts){ el._counts.forEach(countUp); el._counts=null; } }
      });
    }, 600);
  }

  // Ripple on tactile controls
  document.addEventListener('pointerdown', function(e){
    var t = e.target.closest('button,.mc-card,.mrow,.part-item,.team-card,.chat-chip,.ov-btn,.fbtn,.back-btn,.atab');
    if(!t) return;
    if(getComputedStyle(t).position==='static') t.style.position='relative';
    var r = t.getBoundingClientRect(), d = Math.max(r.width,r.height);
    var s = document.createElement('span'); s.className='ripple';
    s.style.width=s.style.height=d+'px';
    s.style.left=(e.clientX-r.left-d/2)+'px'; s.style.top=(e.clientY-r.top-d/2)+'px';
    t.appendChild(s); setTimeout(function(){ s.remove(); },600);
  }, {passive:true});

  // FAB auto-hide while scrolling, reappear when idle
  var lastY=0, idle=null;
  window.addEventListener('scroll', function(){
    var fab=document.getElementById('chat-fab'); if(!fab) return;
    var y=window.scrollY;
    if(y>140 && y>lastY+4) fab.classList.add('hide');
    lastY=y;
    clearTimeout(idle); idle=setTimeout(function(){ fab.classList.remove('hide'); },420);
  }, {passive:true});

  return { enhance: enhance };
})();

// Team colour, lightened when too dark to read on the navy backdrop
function teamTextColor(t){
  var c = (t && t.color) || t || '';
  var m = /^#?([0-9a-fA-F]{6})$/.exec(c || '');
  if(!m) return 'var(--txt)';
  var n = parseInt(m[1],16), r=n>>16&255, g=n>>8&255, b=n&255;
  var lum = 0.299*r + 0.587*g + 0.114*b;
  if(lum >= 115) return c;
  var mix = function(x){ return Math.round(x + (255-x)*0.55); };
  return 'rgb('+mix(r)+','+mix(g)+','+mix(b)+')';
}

function buildPlayerStats(){
  var batters = {}, bowlers = {};

  MATCHES.forEach(function(match){
    if(match.status !== 'completed') return;
    [match.inn1, match.inn2].forEach(function(inn){
      if(!inn || !inn.batting) return;
      // Use inn.team directly — t1/t2 may not match batting order (e.g. KKR batted 1st in MI vs KKR)
      var team = inn.team;

      // Batting
      inn.batting.forEach(function(b){
        var key = b.n + '|' + team;
        if(!batters[key]) batters[key] = {name:b.n, team:team, mat:0, inn:0, runs:0, hs:0, hsNo:false, balls:0, fours:0, sixes:0, fifties:0, hundreds:0, notOuts:0, nineties:0};
        var p = batters[key];
        p.inn++;
        p.runs += b.r;
        p.balls += b.b;
        p.fours += b.f;
        p.sixes += b.s;
        var notOut = b.d === 'not out';
        if(notOut) p.notOuts++;
        if(b.r > p.hs){ p.hs = b.r; p.hsNo = notOut; }
        if(b.r >= 100) p.hundreds++;
        else if(b.r >= 50) p.fifties++;
        if(b.r >= 90 && b.r < 100) p.nineties++;
      });

      // Bowling
      if(!inn.bowling) return;
      inn.bowling.forEach(function(b){
        // Bowling team = the other team (not the one currently batting)
        var bowlTeam = (team === match.t1) ? match.t2 : match.t1;
        // Fallback: if inn.team doesn't match t1/t2, derive from inn.team directly
        if(team !== match.t1 && team !== match.t2){
          bowlTeam = team; // shouldn't happen but safe
        }
        var key = b.n + '|' + bowlTeam;
        if(!bowlers[key]) bowlers[key] = {name:b.n, team:bowlTeam, inn:0, wkts:0, runs:0, balls:0, best_w:0, best_r:999, fifers:0, dotBalls:0};
        var p = bowlers[key];
        p.inn++;
        p.wkts += b.w;
        p.runs += b.r;
        // overs to balls
        var ovStr = String(b.o);
        var parts = ovStr.split('.');
        var fullOvs = parseInt(parts[0]);
        var extraBalls = parts[1] ? parseInt(parts[1]) : 0;
        p.balls += fullOvs * 6 + extraBalls;
        if(b.w > p.best_w || (b.w === p.best_w && b.r < p.best_r)){ p.best_w = b.w; p.best_r = b.r; }
        if(b.w >= 5) p.fifers++;
        
        // Calculate dot balls (estimate: total balls - scoring balls)
        // This is an approximation - in real data you'd have ball-by-ball info
        var scoringBalls = Math.min(p.balls, Math.floor(b.r/1.5)); // rough estimate
        p.dotBalls += Math.max(0, (fullOvs * 6 + extraBalls) - scoringBalls);
      });
    });
  });

  // Compute derived stats
  var batArr = Object.values(batters).filter(function(p){ return p.inn > 0; });
  batArr.forEach(function(p){
    var dismissals = p.inn - p.notOuts;
    p.avg = dismissals > 0 ? (p.runs / dismissals).toFixed(2) : (p.runs > 0 ? p.runs + '*' : '0.00');
    p.sr = p.balls > 0 ? ((p.runs / p.balls) * 100).toFixed(2) : '0.00';
  });

  var bowlArr = Object.values(bowlers).filter(function(p){ return p.balls > 0; });
  bowlArr.forEach(function(p){
    var ovsDecimal = Math.floor(p.balls/6) + (p.balls%6)/10;
    p.overs = ovsDecimal.toFixed(1);
    p.econ = p.balls > 0 ? ((p.runs / p.balls) * 6).toFixed(2) : '0.00';
    p.avg = p.wkts > 0 ? (p.runs / p.wkts).toFixed(2) : '—';
    p.bsr = p.wkts > 0 ? (p.balls / p.wkts).toFixed(1) : '—';
    p.best = p.best_w + '/' + p.best_r;
  });

  return {bat: batArr, bowl: bowlArr};
}

// Get Player of the Match awards
function getPlayerOfMatchStats(){
  var pomCount = {};
  MATCHES.forEach(function(m){
    if(m.status === 'completed' && m.playerOfMatch){
      var player = m.playerOfMatch;
      if(!pomCount[player]) pomCount[player] = {name: player, awards: 0, team: '', matches: []};
      pomCount[player].awards++;
      pomCount[player].matches.push('Match ' + m.no);
      
      // Find player's team from match data
      if(m.inn1 && m.inn1.batting){
        var found = m.inn1.batting.find(function(b){ return b.n === player; });
        if(found) pomCount[player].team = m.inn1.team;
      }
      if(!pomCount[player].team && m.inn2 && m.inn2.batting){
        var found = m.inn2.batting.find(function(b){ return b.n === player; });
        if(found) pomCount[player].team = m.inn2.team;
      }
    }
  });
  
  return Object.values(pomCount).sort(function(a,b){ return b.awards - a.awards; });
}

  }

        '</div>' +
        (match.t1score ? '<div class="md-score">'+match.t1score+' <small>('+match.t1ov+' ov)</small></div>' : '<div class="md-score">—</div>') +
      '</div>' +
      '<div class="md-vs">vs</div>' +
      '<div class="md-team">' +
        '<div class="md-tname">' +
          teamLogoObj(t2, 34) +
          match.t2 +
        '</div>' +
        (match.t2score ? '<div class="md-score">'+match.t2score+' <small>('+match.t2ov+' ov)</small></div>' : '<div class="md-score">—</div>') +
      '</div>' +
    '</div>';
  
  if(match.result) {
    html += '<div class="md-result-bar"><div class="md-result-txt">'+match.result+'</div></div>';
  }
  
  html += '<div class="md-meta-row">' +
    '<div class="md-meta-item"><b>Venue:</b> '+match.venue+'</div>' +
    '<div class="md-meta-item"><b>Date:</b> '+match.date+'</div>';
  
  if(match.toss) {
    html += '<div class="md-meta-item"><b>Toss:</b> '+match.toss+'</div>';
  }
  
  html += '</div>';
  
  // Player of the Match
  if(match.playerOfMatch) {
    html += '<div class="pom-section">' +
      '<div class="pom-title">🏆 Player of the Match</div>' +
      '<div class="pom-content">' +
        playerPhoto(match.playerOfMatch, getPlayerTeam(match, match.playerOfMatch), 40, 'margin-right:12px') +
        '<div>' +
          '<div class="pom-name">'+match.playerOfMatch+'</div>' +
          '<div class="pom-stats">'+getPlayerMatchStats(match, match.playerOfMatch)+'</div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }
  
  html += '</div>';
  
  // Analytics tabs for completed matches
  if(match.status === 'completed') {
    html += '<div class="atabs">' +
      '<button class="atab on" onclick="switchMatchTab(\'scorecard\',this,\''+matchId+'\')">Scorecard</button>' +
      '<button class="atab" onclick="switchMatchTab(\'worm\',this,\''+matchId+'\')">Worm Chart</button>' +
      '<button class="atab" onclick="switchMatchTab(\'overs\',this,\''+matchId+'\')">Over Analysis</button>' +

      '<button class="atab" onclick="switchMatchTab(\'moments\',this,\''+matchId+'\')">Key Moments</button>' +
    '</div>' +
    '<div id="match-analytics"></div>';
    
    // Show default tab
    setTimeout(function(){ switchMatchTab('scorecard', document.querySelector('.atab.on'), matchId); }, 100);
  }

  el.innerHTML = html;
  if(window.Premium) Premium.enhance(el);
}

function getPlayerTeam(match, playerName){
  if(match.inn1 && match.inn1.batting){
    var found = match.inn1.batting.find(function(b){ return b.n === playerName; });
    if(found) return match.inn1.team;
  }
  if(match.inn2 && match.inn2.batting){
    var found = match.inn2.batting.find(function(b){ return b.n === playerName; });
    if(found) return match.inn2.team;
  }
  return '';
}

function getPlayerMatchStats(match, playerName){
  // Look for batting stats
  if(match.inn1 && match.inn1.batting){
    var bat = match.inn1.batting.find(function(b){ return b.n === playerName; });
    if(bat) {
      var sr = bat.b > 0 ? ((bat.r / bat.b) * 100).toFixed(1) : '0.0';
      return bat.r + (bat.d === 'not out' ? '*' : '') + '(' + bat.b + ') · SR ' + sr + ' · ' + bat.f + '×4 ' + bat.s + '×6';
    }
  }
  if(match.inn2 && match.inn2.batting){
    var bat = match.inn2.batting.find(function(b){ return b.n === playerName; });
    if(bat) {
      var sr = bat.b > 0 ? ((bat.r / bat.b) * 100).toFixed(1) : '0.0';
      return bat.r + (bat.d === 'not out' ? '*' : '') + '(' + bat.b + ') · SR ' + sr + ' · ' + bat.f + '×4 ' + bat.s + '×6';
    }
  }
  
  // Look for bowling stats
  if(match.inn1 && match.inn1.bowling){
    var bowl = match.inn1.bowling.find(function(b){ return b.n === playerName; });
    if(bowl) return bowl.w + '/' + bowl.r + ' in ' + bowl.o + ' ov';
  }
  if(match.inn2 && match.inn2.bowling){
    var bowl = match.inn2.bowling.find(function(b){ return b.n === playerName; });
    if(bowl) return bowl.w + '/' + bowl.r + ' in ' + bowl.o + ' ov';
  }
  
  return 'Outstanding performance';
}

function switchMatchTab(tab, btn, matchId){
  document.querySelectorAll('.atab').forEach(function(b){ b.classList.remove('on'); });
  btn.classList.add('on');
  
  var match = MATCHES.find(function(m){ return m.id === matchId; });
  if(!match) return;
  
  var el = document.getElementById('match-analytics');
  if(!el) return;
  
  var html = '';
  
  if(tab === 'scorecard') {
    html = renderScorecard(match);
  } else if(tab === 'worm') {
    html = renderWormChart(match);
  } else if(tab === 'overs') {
    html = renderOverAnalysis(match);
  } else if(tab === 'partnerships') {
    html = renderPartnerships(match);
  } else if(tab === 'players') {
    html = renderPlayerAnalysis(match);
  } else if(tab === 'moments') {
    html = renderKeyMoments(match);
  }

  el.innerHTML = html;
  if(window.Premium) Premium.enhance(el);
}

function renderWormChart(match){
  if(!match.inn1 || !match.inn2 || !match.inn1.overR || !match.inn2.overR){
    return '<div class="stats-note">Worm chart will appear when over-by-over feed is available for this match.</div>';
  }
  var sumArr = function(a){ var t=0; (a||[]).forEach(function(r){ t+=r; }); return t; };
  var t1tot = sumArr(match.inn1.overR), t2tot = sumArr(match.inn2.overR);
  var maxTotal = Math.max(t1tot, t2tot, 1);
  var lastOver = Math.max(match.inn1.overR.length, match.inn2.overR.length, 1);
  // plot geometry (viewBox units)
  var W=820,H=360,L=46,R=14,T=16,B=30, pw=W-L-R, ph=H-T-B, baseY=T+ph;
  var X=function(i){ return L + (i/lastOver)*pw; };
  var Y=function(v){ return T + ph - (v/maxTotal)*ph; };
  var lineColor=function(t){ return teamTextColor(TEAMS[t]); };
  // grid + y labels
  var step = maxTotal>200?50:(maxTotal>100?40:25), grid='', yl='';
  for(var g=0; g<=maxTotal; g+=step){
    var gy=Y(g).toFixed(1);
    grid += '<line x1="'+L+'" y1="'+gy+'" x2="'+(W-R)+'" y2="'+gy+'" stroke="rgba(255,255,255,.06)" stroke-width="1"/>';
    yl += '<text x="'+(L-8)+'" y="'+(+gy+3)+'" text-anchor="end" font-family="Barlow Condensed" font-size="11" fill="var(--dim)">'+g+'</text>';
  }
  var xl='';
  for(var o=0; o<=lastOver; o+=(lastOver>12?5:3)){
    xl += '<text x="'+X(o).toFixed(1)+'" y="'+(baseY+18)+'" text-anchor="middle" font-family="Barlow Condensed" font-size="11" fill="var(--dim)">'+o+'</text>';
  }
  var series=function(overR, team, id){
    var c=lineColor(team), pts=[], cum=0, endX=0, endY=0;
    overR.forEach(function(runs,i){ cum+=runs; var x=X(i), y=Y(cum); pts.push(x.toFixed(1)+','+y.toFixed(1)); endX=x; endY=y; });
    var area='M '+X(0).toFixed(1)+','+baseY+' L '+pts.join(' L ')+' L '+endX.toFixed(1)+','+baseY+' Z';
    return {
      defs:'<linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+c+'" stop-opacity=".32"/><stop offset="1" stop-color="'+c+'" stop-opacity="0"/></linearGradient>',
      area:'<path d="'+area+'" fill="url(#'+id+')"/>',
      line:'<polyline fill="none" stroke="'+c+'" stroke-width="3" points="'+pts.join(' ')+'"/>',
      dot:'<circle cx="'+endX.toFixed(1)+'" cy="'+endY.toFixed(1)+'" r="5" fill="'+c+'" stroke="#0a1425" stroke-width="2"><animate attributeName="r" values="5;7;5" dur="2s" repeatCount="indefinite"/></circle>',
      color:c
    };
  };
  var s1=series(match.inn1.overR, match.inn1.team, 'wg1');
  var s2=series(match.inn2.overR, match.inn2.team, 'wg2');
  var svg='<svg class="worm-svg" viewBox="0 0 '+W+' '+H+'">'+
    '<defs>'+s1.defs+s2.defs+'</defs>'+grid+yl+xl+
    '<line x1="'+L+'" y1="'+baseY+'" x2="'+(W-R)+'" y2="'+baseY+'" stroke="rgba(255,255,255,.14)" stroke-width="1"/>'+
    s1.area+s2.area+s1.line+s2.line+s1.dot+s2.dot+'</svg>';
  var leg=function(team,tot,c){ return '<div class="worm-legend-item"><div class="worm-legend-dot" style="background:'+c+';color:'+c+'"></div>'+team+' · '+tot+'</div>'; };
  return '<div class="worm-chart-wrap">'+
    '<div class="worm-chart-title">Run Rate Progression · Cumulative Score</div>'+
    svg+
    '<div class="worm-legend">'+leg(match.inn1.team,t1tot,s1.color)+leg(match.inn2.team,t2tot,s2.color)+'</div>'+
  '</div>';
}

function renderOverAnalysis(match){
  if(!match.inn1 || !match.inn2 || !match.inn1.overR || !match.inn2.overR){
    return '<div class="stats-note">Over analysis will appear when over-by-over feed is available for this match.</div>';
  }
  var activeInn = 0;
  var html = '<div class="ov-chart-wrap">' +
    '<div class="ov-controls">' +
      '<button class="ov-btn on" onclick="switchOverView(0,this,\''+match.id+'\')">'+match.inn1.team+' Innings</button>' +
      '<button class="ov-btn" onclick="switchOverView(1,this,\''+match.id+'\')">'+match.inn2.team+' Innings</button>' +
    '</div>' +
    '<div id="over-chart-content"></div>' +
  '</div>';
  
  setTimeout(function(){ switchOverView(0, document.querySelector('.ov-btn.on'), match.id); }, 100);

function switchOverView(innIndex, btn, matchId){
  document.querySelectorAll('.ov-btn').forEach(function(b){ b.classList.remove('on'); });
  btn.classList.add('on');
  
  var match = MATCHES.find(function(m){ return m.id === matchId; });
  var inn = innIndex === 0 ? match.inn1 : match.inn2;
  
  var html = '<div class="ov-bars">';
  
  if(inn.overR) {
    var maxRuns = Math.max.apply(Math, inn.overR) || 1;
    inn.overR.forEach(function(runs, i){
      var height = Math.max(6, (runs / maxRuns) * 190);
      var wk = (inn.overW && inn.overW[i]) || 0;
      var tip = 'Over '+(i+1)+' · '+runs+' run'+(runs===1?'':'s')+(wk?' · '+wk+' wkt'+(wk>1?'s':''):'');
      html += '<div class="ov-bar '+(wk?'has-wicket':'')+'" style="height:'+height.toFixed(0)+'px;--i:'+i+'" data-tip="'+tip+'">' +
        runs +
        '<div class="ov-bar-label">'+(i+1)+'</div>' +
      '</div>';
    });
  }
  
  html += '</div>';
  
  document.getElementById('over-chart-content').innerHTML = html;
}

function renderPartnerships(match){
  if((!match.inn1 || !match.inn1.pships || !match.inn1.pships.length) && (!match.inn2 || !match.inn2.pships || !match.inn2.pships.length)){
    return '<div class="stats-note">Partnership data not available for this match yet.</div>';
  }
  var html = '<div class="part-list">';
  
  [match.inn1, match.inn2].forEach(function(inn){
    if(!inn || !inn.pships) return;
    
    var team = TEAMS[inn.team];
    var topR = 0; inn.pships.forEach(function(p){ if((p.r||0)>topR) topR=p.r; });
    html += '<div style="grid-column:1/-1;font-family:Teko,sans-serif;font-size:20px;font-weight:700;color:'+teamTextColor(team)+';margin:18px 0 10px;display:flex;align-items:center;gap:8px">'+teamLogoObj(team,20)+inn.team+' Partnerships</div>';

    inn.pships.forEach(function(p){
      var rr = p.b > 0 ? ((p.r / p.b) * 6).toFixed(1) : '0.0';
      var isTop = (p.r||0)===topR && topR>0;
      html += '<div class="part-item'+(isTop?' part-top':'')+'">' +
        '<div class="part-header">' +
          '<div class="part-wkt">'+p.wkt+' Wkt'+(isTop?'<span class="part-top-chip">Top Stand</span>':'')+'</div>' +
          '<div class="part-runs">'+p.r+'</div>' +
        '</div>' +
        '<div class="part-players">'+p.p1+' & '+p.p2+'</div>' +
        '<div class="part-details">'+p.b+' balls · RR '+rr+'</div>' +
      '</div>';
    });
  });
  
  html += '</div>';
  return html;
}

// Derive key moments from scorecard data when no editorial timeline exists
function buildMoments(inn){
  if(!inn) return null;
  var out = [];
  (inn.batting||[]).forEach(function(b){
    if((b.r||0) >= 100) out.push({ov:'—',i:'💯',t:b.n+' hits a century!',d:b.r+' ('+b.b+') · '+(b.f||0)+' fours, '+(b.s||0)+' sixes · SR '+(b.b?((b.r/b.b)*100).toFixed(1):'0')});
    else if((b.r||0) >= 50) out.push({ov:'—',i:'🔥',t:b.n+' brings up a fifty',d:b.r+' ('+b.b+') · '+(b.f||0)+' fours, '+(b.s||0)+' sixes · SR '+(b.b?((b.r/b.b)*100).toFixed(1):'0')});
  });
  var bp = null;
  (inn.pships||[]).forEach(function(p){ if(!bp || p.r>bp.r) bp = p; });
  if(bp && bp.r>=40) out.push({ov:'—',i:'🤝',t:'Key stand: '+bp.p1+' & '+bp.p2,d:bp.r+' runs off '+bp.b+' balls for the '+bp.wkt+(bp.wkt===1?'st':bp.wkt===2?'nd':bp.wkt===3?'rd':'th')+' wicket'});
  (inn.bowling||[]).forEach(function(b){
    if((b.w||0) >= 3) out.push({ov:'—',i:'🎯',t:b.n+' rips through the order',d:b.w+' wickets for '+b.r+' runs in '+b.o+' overs'});
  });
  if(inn.total) out.push({ov:'20',i:'🏏',t:inn.team+' finish on '+inn.total,d:'End of innings'});
  return out.length ? out : null;
}
// Derive player ratings/impact from scorecard data when no editorial ratings exist
function buildRatings(match){
  var players = [];
  [match.inn1, match.inn2].forEach(function(inn){
    if(!inn) return;
    (inn.batting||[]).forEach(function(b){
      if(!b.b) return;
      var sr = (b.r/b.b)*100;
      var v = Math.min(10, (b.r||0)/12 + (b.s||0)*0.35 + (sr>150?1:0));
      players.push({n:b.n,t:inn.team,role:'Batting',v:+v.toFixed(1),score:b.r||0,
        note:b.r+' ('+b.b+'), SR '+sr.toFixed(1)+', '+(b.f||0)+'x4 '+(b.s||0)+'x6'});
    });
    (inn.bowling||[]).forEach(function(b){
      var balls = (String(b.o).split('.')[0]|0)*6 + (String(b.o).split('.')[1]|0);
      var econ = balls ? (b.r/balls)*6 : 0;
      var v = Math.min(10, (b.w||0)*2.2 + (econ<7?1.5:econ<9?0.7:0) + 1);
      players.push({n:b.n,t:inn.team,role:'Bowling',v:+v.toFixed(1),score:(b.w||0)*100-(b.r||0),
        note:(b.w||0)+'/'+(b.r||0)+' in '+b.o+' ov, econ '+econ.toFixed(2)});
    });
  });
  players.sort(function(a,b){ return b.v - a.v || b.score - a.score; });
  return players.slice(0, 6);
}

function renderKeyMoments(match){

  var m2 = (match.inn2 && (match.inn2.moments || buildMoments(match.inn2))) || null;
  if(!m1 && !m2){
    return '<div class="stats-note">Key moments timeline will be shown when ball-by-ball events are available.</div>';

  var html = '<div class="km-list">';

  [[match.inn1,m1],[match.inn2,m2]].forEach(function(pair){

    if(!inn || !moments) return;

function renderTeams(){
  var stats = buildPlayerStats();
  var bat = stats.bat, bowl = stats.bowl;

  Object.keys(TEAMS).forEach(function(tc){ if(order.indexOf(tc) < 0) order.push(tc); });

  var recItem = function(v,l){ return '<div class="tc-record-item"><div class="tc-record-val">'+v+'</div><div class="tc-record-label">'+l+'</div></div>'; };

  var html = '<div class="main-w">' +
    '<div class="sh"><h2>IPL 2026 Teams</h2><p>Squads · Key Performers · Where They Finished</p></div>' +
    '<div class="team-list">';

  order.forEach(function(teamCode){
    var team = TEAMS[teamCode]; if(!team) return;
    var squad = SQUADS[teamCode] || {};
    var rec = POINTS.find(function(p){ return p.team === teamCode; }) || {p:0,w:0,l:0,pts:0,nrr:'—'};
    var fin = teamFinish(teamCode);
    var captain = team.captain || '';
    var coach = team.coach || '';

    // Key players
    var keyHtml = teamKeyPlayers(teamCode, bat, bowl).map(function(k){
      return '<div class="tc-key">' +
        playerPhoto(k.n, teamCode, 44, 'margin-right:11px;flex-shrink:0') +
        '<div style="min-width:0">' +
          '<div class="tc-key-tag">'+k.tag+'</div>' +
          '<div class="tc-key-name">'+k.n+'</div>' +
          '<div class="tc-key-stat">'+k.stat+'</div>' +
        '</div>' +
      '</div>';
    }).join('') || '<div class="stats-note">No performance data.</div>';

    // Squad chips (captain first, then the rest)
    var playerChip = function(name, role, badge){
      var pb = bat.find(function(b){ return b.name===name && b.team===teamCode; });
      var pw = bowl.find(function(b){ return b.name===name && b.team===teamCode; });
      var s = '';
      if(pb && pb.runs>0) s = pb.runs+' runs';
      if(pw && pw.wkts>0) s = (s?s+' · ':'')+pw.wkts+' wkts';
      return '<div class="tc-player'+(badge==='CAPTAIN'?' tc-player-cap':'')+'">' +
        '<div class="tc-player-name">'+name+(badge?' <span class="tc-badge">'+badge+'</span>':'')+'</div>' +
        '<div class="tc-player-role">'+shortRole(role)+'</div>' +
        (s?'<div class="tc-player-stats">'+s+'</div>':'') +
      '</div>';
    };
    var names = Object.keys(squad);
    var capChip = (captain && squad[captain]) ? playerChip(captain, squad[captain].role, 'CAPTAIN')
                : (captain ? playerChip(captain, '', 'CAPTAIN') : '');
    var restChips = names.filter(function(n){ return n !== captain; })
                         .map(function(n){ return playerChip(n, squad[n].role, ''); }).join('');

    html += '<div class="team-card">' +
      '<div class="tc-header" style="background:linear-gradient(135deg,'+team.color+'26,transparent 60%)">' +
        '<div class="tc-name-row" style="margin-bottom:0">' +
          '<img class="tc-logo" src="'+team.logo+'" alt="'+teamCode+'">' +
          '<div class="tc-info" style="flex:1">' +
            '<h3>'+team.name+'</h3>' +
            '<p>'+(team.city||'')+(captain?' · Captain '+captain:'')+'</p>' +
          '</div>' +
          '<div class="tc-finish tc-finish-'+fin.tone+'">'+fin.label+'</div>' +
        '</div>' +
        '<div class="tc-intro">'+(TEAM_INTROS[teamCode]||'')+'</div>' +
      '</div>' +
      '<div class="tc-section">' +
        '<div class="tc-section-hd">★ Key Players</div>' +
        '<div class="tc-key-grid">'+keyHtml+'</div>' +
      '</div>' +
      '<div class="tc-section">' +
        '<div class="tc-section-hd">Season</div>' +
        '<div class="tc-record">' +
          recItem(rec.p,'Played')+recItem(rec.w,'Won')+recItem(rec.l,'Lost')+recItem(rec.pts,'Points')+recItem(rec.nrr,'NRR') +
        '</div>' +
      '</div>' +

        '<div class="tc-section-hd">Full Squad · '+names.length+' players</div>' +
        (coach?'<div class="tc-staff"><span class="tc-staff-chip"><b>Coach</b>'+coach+'</span></div>':'') +

  });

  html += '</div></div>';

}

function playoffTag(stage){
  var map = {'Qualifier 1':'Q1','Qualifier 2':'Q2','Eliminator':'ELIM','Final':'🏆'};
  return map[stage] || stage;
}

function renderSchedule(){
  var el = document.getElementById('schedule-content');
  if(!el) return;
  
  var completedCount = MATCHES.filter(function(m){ return m.status === 'completed'; }).length;
  var subtitle = (completedCount === MATCHES.length && MATCHES.length)
    ? 'Complete Fixture List • Full Season Results'
    : 'Complete Fixture List • Upcoming Matches • Results';
  var html = '<div class="main-w">' +
    '<div class="sh"><h2>IPL 2026 Schedule</h2><p>'+subtitle+'</p></div>';

  // Group all matches by date, preserving schedule order
  var days = [], byDate = {};
  MATCHES.forEach(function(m){
    var key = m.date.replace(/ 2026$/, '');
    if(!byDate[key]){ byDate[key] = []; days.push(key); }
    byDate[key].push(m);
  });

  days.forEach(function(dateStr){
    html += '<div class="date-sep">'+dateStr+'</div>';
    byDate[dateStr].forEach(function(match){
      var t1 = TEAMS[match.t1], t2 = TEAMS[match.t2];
      var statusClass = match.status === 'completed' ? 'completed-match' : 'today-match';
      html += '<div class="mrow '+statusClass+'" onclick="viewMatch(\''+match.id+'\')">' +
        '<div class="mno">'+(match.stage ? '<span title="'+match.stage+'">'+playoffTag(match.stage)+'</span>' : match.no)+'</div>' +
        '<div class="mteams">' +
          '<div class="mteam">' +
            teamLogoObj(t1, 20) +
            match.t1 +
          '</div>' +
          '<div class="mvs">VS</div>' +
          '<div class="mteam">' +
            teamLogoObj(t2, 20) +
            match.t2 +
          '</div>' +
        '</div>' +
        '<div class="mright">';
      if(match.status === 'completed') {
        html += '<div class="m-result-badge">'+match.result+'</div>';
      } else {
        html += '<div class="mtime">'+(match.time||'7:30 PM')+'</div>';
      }
      html += '</div></div>';
    });
  });

  html += '</div>';
  el.innerHTML = html;
}

// ═══ CHATBOT SYSTEM ═══

async function sendChatMessage(){
  var input = document.getElementById('chat-input');
  var message = input.value.trim();
  if(!message) return;

  input.value = '';
  chatHistory.push({role: 'user', content: message});
  renderChatMessages();

  var typing = document.getElementById('chat-typing');
  if(typing) typing.style.display = 'flex';

  var reply = await getChatReply(message);
  if(typing) typing.style.display = 'none';
  chatHistory.push({role: 'assistant', content: reply});
  renderChatMessages();
}

// Uses the hosted LLM when CONFIG.chat.apiKey is set (kept wired for future
// seasons); otherwise answers instantly from the offline season analyst.
async function getChatReply(message){
  if(CONFIG.chat && CONFIG.chat.apiKey){
    try {
      var context = {
        season: CONFIG.seasonLabel,
        matches: MATCHES.filter(function(m){ return m.status==='completed'; }).map(function(m){
          return { no:m.no, stage:m.stage, teams:[m.t1,m.t2], result:m.result, pom:m.playerOfMatch }; }),
        points: POINTS, stats: buildPlayerStats(), pom: getPlayerOfMatchStats()
      };
      var res = await fetch(CONFIG.chat.endpoint, {
        method:'POST',
        headers:{ 'Content-Type':'application/json', 'x-api-key':CONFIG.chat.apiKey,
                  'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' },
        body: JSON.stringify({ model: CONFIG.chat.model, max_tokens: 1000, messages:[{ role:'user',
          content: 'You are IPLBuzz Bot, an analyst for '+CONFIG.seasonLabel+'. Data:\n'+JSON.stringify(context)+'\n\nQ: '+message+'\nAnswer concisely with exact numbers.' }] })
      });
      if(res.ok){ var d = await res.json(); if(d.content && d.content[0]) return d.content[0].text; }
    } catch(e){ /* fall through to offline analyst */ }
  }
  return new Promise(function(resolve){ setTimeout(function(){ resolve(answerLocally(message)); }, 300); });
}

function answerLocally(msg){
  var q = (msg||'').toLowerCase();
  var stats = buildPlayerStats();
  var bat = stats.bat.slice().sort(function(a,b){return b.runs-a.runs;});
  var bowl = stats.bowl.slice().sort(function(a,b){return b.wkts-a.wkts || a.runs-b.runs;});
  var pom = getPlayerOfMatchStats() || [];
  var finalM = MATCHES.find(function(m){ return m.stage === 'Final'; });
  var teamName = function(ab){ return TEAMS[ab] ? TEAMS[ab].name : ab; };

  // Team mentioned?
  var teamAb = null;
  Object.keys(TEAMS).forEach(function(ab){
    var t = TEAMS[ab];
    if(q.indexOf(ab.toLowerCase())>=0 || (t && t.name && q.indexOf(t.name.toLowerCase())>=0)) teamAb = ab;
  });

  var has = function(){ for(var i=0;i<arguments.length;i++){ if(q.indexOf(arguments[i])>=0) return true; } return false; };

  if(has('champion','won ipl','win ipl','winner of ipl','who won','trophy','title') && !teamAb
     && !has('cap','wicket','run','point','table','standing','score','fifty','fifties','hundred','six')){
    if(finalM){
      var champ = finalM.result.split(' ')[0];
      var runner = finalM.t1===champ?finalM.t2:finalM.t1;
      return '🏆 '+teamName(champ)+' are the IPL 2026 champions!\n\nThey beat '+teamName(runner)+' in the Final — '+finalM.result+'. Player of the Match: '+finalM.playerOfMatch+'.';
    }
  }
  if(has('orange cap','most run','top run','highest run','leading run')){
    var o = bat[0];
    return o ? '🟠 Orange Cap: '+o.name+' ('+teamName(o.team)+') with '+o.runs+' runs at a strike rate of '+o.sr+' — '+o.fifties+' fifties, '+o.hundreds+' hundreds, HS '+o.hs+(o.hsNo?'*':'')+'.' : 'No batting data available.';
  }
  if(has('purple cap','most wicket','top wicket','leading wicket','best bowler')){
    var w = bowl[0];
    return w ? '🟣 Purple Cap: '+w.name+' ('+teamName(w.team)+') with '+w.wkts+' wickets, economy '+w.econ+', best figures '+w.best+'.' : 'No bowling data available.';
  }
  if(has('most six','biggest hitter')){
    var s = stats.bat.slice().sort(function(a,b){return b.sixes-a.sixes;})[0];
    return s ? '6️⃣ Most sixes: '+s.name+' ('+teamName(s.team)+') smashed '+s.sixes+' sixes this season.' : 'No data.';
  }
  if(has('player of the match','most awards','mvp','most valuable','most pom')){
    var p = pom[0];
    return p ? '⭐ Most Player-of-the-Match awards: '+p.name+' ('+teamName(p.team)+') with '+p.awards+' award'+(p.awards>1?'s':'')+'.' : 'No POM data.';
  }
  if(has('points','table','standing','final table','league')){
    var lines = POINTS.slice(0,6).map(function(p,i){ return (i+1)+'. '+p.team+' — '+p.pts+' pts ('+p.w+'W '+p.l+'L, NRR '+p.nrr+')'; });
    return '📊 Final IPL 2026 standings:\n'+lines.join('\n')+'\n\nTop 4 qualified for the playoffs.';
  }
  if(teamAb){
    var pt = POINTS.find(function(p){ return p.team===teamAb; });
    var pos = POINTS.findIndex(function(p){ return p.team===teamAb; })+1;
    var isChamp = finalM && finalM.result.split(' ')[0]===teamAb;
    var isRunner = finalM && (finalM.t1===teamAb||finalM.t2===teamAb) && !isChamp;
    var extra = isChamp ? ' They went on to win the title! 🏆' : isRunner ? ' They finished runners-up in the Final.' : (pos<=4 ? ' They reached the playoffs.' : '');
    return pt ? teamName(teamAb)+' finished '+pos+(pos===1?'st':pos===2?'nd':pos===3?'rd':'th')+' in the league with '+pt.pts+' points ('+pt.w+' wins, '+pt.l+' losses, NRR '+pt.nrr+').'+extra
              : 'I have data on all 10 teams — try asking about their record or the points table.';
  }
  // Default
  var champTxt = finalM ? teamName(finalM.result.split(' ')[0])+' won IPL 2026. ' : '';
  return '🏏 IPL 2026 is complete! '+champTxt+'Ask me about the champions, the Orange Cap, the Purple Cap, the final points table, or any team\'s season.';
}

function toggleChat(){
  chatOpen = !chatOpen;

      chatHistory.push({
        role:'assistant',

      });
      renderChatMessages();

  if(btn) btn.innerHTML = chatOpen ? '✕' : '🏏';
}

function chatKeyDown(e){

}

  });

function preloadHeavyAssets(){

    './Squads.csv','./Partnerships.csv','./FOW.csv','./Overs.csv'

  urls.forEach(function(url){
    fetch(url, { cache: 'force-cache' }).catch(function(){});
  });
}

    <div id="chat-header-info">
      <div id="chat-header-title">IPLBuzz Bot</div>
      <div id="chat-header-sub"><div class="live-dot"></div>AI Cricket Analyst</div>
    </div>
    <button onclick="toggleChat()" style="background:none;border:none;color:var(--dim2);font-size:18px;cursor:pointer;padding:4px">✕</button>
  </div>

  <div id="chat-messages"></div>

  <div id="chat-typing">
    <div class="typing-dots"><span></span><span></span><span></span></div>
    Analysing...
  </div>

  <div id="chat-chips">
    <button class="chat-chip" onclick="quickChat('Who won IPL 2026?')">🏆 Champions</button>
    <button class="chat-chip" onclick="quickChat('Who won the Orange Cap?')">🟠 Orange Cap</button>
    <button class="chat-chip" onclick="quickChat('Who won the Purple Cap?')">🟣 Purple Cap</button>
    <button class="chat-chip" onclick="quickChat('Show me the final points table')">📊 Points table</button>
    <button class="chat-chip" onclick="quickChat('Who won the most Player of the Match awards?')">⭐ Most POM</button>
  </div>

  <div id="chat-input-row">
    <textarea id="chat-input" rows="1" placeholder="Ask about scores, stats, predictions…" onkeydown="chatKeyDown(event)"></textarea>
    <button id="chat-send" onclick="sendChatMessage()">➤</button>
  </div>
</div>

</body>
</html>
